<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CLIP BETA — nekonečné plátno pro macOS</title>
<meta name="description" content="CLIP je první lokálně běžící open-source aplikace pro macOS, která promění vaše uložené reely, tweety, piny a poznámky na nekonečné plátno." />
<link rel="icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="index.css" />
<meta property="og:title" content="CLIP BETA — nekonečné plátno pro macOS" />
<meta property="og:description" content="Lokálně běžící open-source aplikace pro macOS. Apple Silicon (M1+)." />
<meta property="og:image" content="assets/mark.png" />
</head>
<body>

  <!-- Background video -->
  <div class="bg-media">
    <video autoplay muted loop playsinline preload="auto">
      <source src="assets/hero.mp4" type="video/mp4" />
      <source src="assets/hero.webm" type="video/webm" />
    </video>
  </div>

  <!-- Top-left brand -->
  <a class="ui-brand" href="/">CLIP&nbsp;BeTA</a>

  <!-- Top-right: platform label + download pill -->
  <div class="ui-top-right">
    <span class="ui-platform">APPLE SILICON (M1+)</span>
    <button class="ui-pill" id="downloadBtn" type="button" aria-haspopup="dialog" aria-expanded="false">
      <span class="ui-pill-icon">
        <img src="assets/qr.svg" alt="" />
      </span>
      <span class="ui-pill-label">Stahnout</span>
    </button>
  </div>

  <!-- Download modal — slides in from the right -->
  <div class="modal-backdrop" id="modalBackdrop" hidden></div>
  <aside class="modal" id="downloadModal" role="dialog" aria-modal="true"
         aria-label="Stáhnout CLIP" hidden>
    <button class="modal-close" id="modalClose" type="button" aria-label="Zavřít">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="modal-qr">
      <img src="assets/qr-code.svg" alt="QR kód pro instalaci CLIP" />
    </div>
    <div class="modal-text">
      <p class="modal-lead">Návod k instalaci:<br>Put install manual here</p>
      <a class="modal-link" href="install.html">Stahnout na svůj Mac</a>
    </div>
  </aside>

  <!-- Bottom-left description -->
  <p class="ui-description">
    CLIP je první lokálně běžící open-source aplikace pro macOS,
    která promění vaše uložené reely, tweety, piny a poznámky
    na nekonečné plátno.
  </p>

  <!-- Bottom-right GitHub link -->
  <a class="ui-git" href="https://github.com/Tsel96/clip">GIT repozitář</a>

  <script>
    (function () {
      var btn = document.getElementById('downloadBtn');
      var modal = document.getElementById('downloadModal');
      var backdrop = document.getElementById('modalBackdrop');
      var closeBtn = document.getElementById('modalClose');

      function open() {
        modal.hidden = false;
        backdrop.hidden = false;
        // next frame so the transition runs
        requestAnimationFrame(function () {
          modal.classList.add('open');
          backdrop.classList.add('open');
        });
        btn.setAttribute('aria-expanded', 'true');
        document.addEventListener('keydown', onKey);
      }
      function close() {
        modal.classList.remove('open');
        backdrop.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
        document.removeEventListener('keydown', onKey);
        var done = function () {
          modal.hidden = true;
          backdrop.hidden = true;
          modal.removeEventListener('transitionend', done);
        };
        modal.addEventListener('transitionend', done);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }

      btn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      backdrop.addEventListener('click', close);
    })();
  </script>
</body>
</html>

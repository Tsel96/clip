name: Build & Release CLIP

# Builds the macOS app on a real Mac runner. Every push compiles (the build
# gate), but only `main`, `v*` tags, or a manual run PUBLISH CLIP.dmg +
# CLIP.zip + latest.json to GitHub Releases. The website's Download button
# (releases/latest/download/CLIP.dmg) and the in-app self-updater
# (releases/latest/download/latest.json) both track "latest", so work-in-
# progress branches must never publish — installed copies (the exhibition
# kiosk) would auto-install them.
#
# Update signing: set the repo secret UPDATE_SIGNING_KEY (from
# `swift Scripts/sign-update.swift genkey`). Builds then embed the public key
# and sign CLIP.zip; the app refuses unsigned or mis-signed updates.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths-ignore: ['site/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # macOS 26 image: the app uses the Liquid Glass API (Glass /
    # glassEffect) which only exists in the macOS 26 SDK (Xcode 26).
    # Older runner images fail with "cannot find type 'Glass' in scope".
    runs-on: macos-26
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Build release binary
        run: swift build -c release

      - name: Derive update public key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            echo "UPDATE_PUBLIC_KEY=$(swift Scripts/sign-update.swift pubkey)" >> "$GITHUB_ENV"
          else
            echo "::warning::UPDATE_SIGNING_KEY secret not set — updates will NOT be signed."
          fi

      - name: Bundle .app, .zip and .dmg
        env:
          MARKETING: "1.0"
          BUILD: ${{ github.run_number }}
          FEED_URL: "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          ZIP: "1"
          DMG: "1"
        run: Scripts/make-app.sh

      - name: Write self-update manifest
        if: env.PUBLISH == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(shasum -a 256 CLIP.zip | awk '{print $1}')
          SIG=""
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            SIG=$(swift Scripts/sign-update.swift sign CLIP.zip)
          fi
          cat > latest.json <<EOF
          {
            "build": $RUN_NUMBER,
            "version": "1.0 ($RUN_NUMBER)",
            "url": "https://github.com/$REPO/releases/latest/download/CLIP.zip",
            "sha256": "$SHA",
            "signature": "$SIG"
          }
          EOF
          echo "latest.json:"; cat latest.json

      - name: Publish release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CLIP 1.0 (build ${{ github.run_number }})
          make_latest: true
          body: |
            Automated build from `${{ github.sha }}`.
            Download **CLIP.dmg** below and drag CLIP into Applications.
            Installed copies self-update to this build automatically.
          files: |
            CLIP.dmg
            CLIP.zip
            latest.json
